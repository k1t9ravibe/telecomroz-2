name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rent-monitoring/package-lock.json
      - name: Сборка «Мониторинг стоимости аренды»
        working-directory: rent-monitoring
        run: |
          npm ci
          npm test
          npm run build
      - name: Подготовка сайта
        run: |
          mkdir -p _site/rent-monitoring
          cp index.html app.js styles.css kazakhtelecom-logo.png _site/
          cp -r rent-monitoring/dist/. _site/rent-monitoring/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}rent-monitoring/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
